<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-gray-300 min-h-screen items-center flex justify-center p-6">
    <div class="w-full max-w-xl">
        <div class="w-full max-w-xl">
        <h1 class="text-2xl font-bold text-gray-700 mb-2 ml-2 mt-6">NOTES APP</h1>
        <div>
            <input id="searchInput" type="text" placeholder="Search notes..." class="flex-1 border border-gray-300 rounded-xl p-2.5 text-sm bg-white focus:outline-none w-full mb-2">
             <select id="category" class="mb-3 cursor-pointer border-2 border-gray-300 rounded-xl p-2.5 text-gray-700 bg-white focus:outline-none focus:border-gray-400 w-full">
                    <option value="All">All Categories</option>
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Ideas">Ideas</option>
                    <option value="Tasks">Tasks</option>
                    <option value="Journal">Journal</option>
              </select>
        </div>
        <div class="bg-white border-2 border-black/50 rounded-2xl p-10 shadow-2xl mb-8">
            <form id="noteForm" class="w-full flex flex-col items-center p-4">
                <h2 class="text-2xl font-bold text-gray-600 w-full mb-2">Create a Note</h2>
                 <input id="title" type="text" placeholder="Title" class="font-bold w-full
                 border border-gray-300 text-gray-700 rounded-xl p-3 focus:outline-gray-500 mb-4">
                 <textarea name="note-content" id="note-content" placeholder="Take a note..." class="w-full
                  border border-gray-300 text-gray-700 rounded-xl p-3 focus:outline-gray-500 mb-5"></textarea>
                  <div class="w-full flex flex-wrap gap-4 items-center justify-between mb-5">
                    <div class="flex-1">
                        <label class="block font-semibold text-gray-500 mb-2">Category</label>
                         <select id="filterCategory" class="mb-3 cursor-pointer border border-gray-300 rounded-xl p-2.5 text-gray-700 bg-white focus:outline-2 focus:outline-gray-400 w-full">
                           <option value="All">All Categories</option>
                           <option value="Personal">Personal</option>
                           <option value="Work">Work</option>
                           <option value="Ideas">Ideas</option>
                           <option value="Tasks">Tasks</option>
                           <option value="Journal">Journal</option>
                         </select>
                    </div>
                  </div>
                  <button id="btn" class="border py-2 px-3 border-gray-400 rounded-4xl cursor-pointer text-white bg-black/50 hover:bg-black/70 transition-all w-full">+ Add Note</button>
            </form>
        </div>
        <div class="bg-gray-300 rounded-2xl  mb-4">
           <div id="notes" class="w-full mt-5"></div>
        </div>
        <!-- <div id="notes" class="w-full mt-5"></div> -->
    </div>
    <script src="script.js"></script>
</body>
</html>
